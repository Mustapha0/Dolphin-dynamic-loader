name: Build Dolphin App Builder APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Write build service config
        env:
          DOLPHIN_BUILD_API: ${{ secrets.DOLPHIN_BUILD_API }}
          DOLPHIN_BUILD_TOKEN: ${{ secrets.DOLPHIN_BUILD_TOKEN }}
        run: |
          API="${DOLPHIN_BUILD_API:-https://dolphin-dynamic-loader-3.onrender.com}"
          if [ -z "$DOLPHIN_BUILD_TOKEN" ]; then
            echo "::warning::Secret DOLPHIN_BUILD_TOKEN is not set. The APK will still build; enter the token in the app's settings screen."
          fi
          printf 'window.DOLPHIN_BUILD_API = "%s";\nwindow.DOLPHIN_BUILD_TOKEN = "%s";\n' "$API" "$DOLPHIN_BUILD_TOKEN" > app/src/main/assets/config.js
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dolphin-App-Builder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
